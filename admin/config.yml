backend:
  name: github
  repo: aungsettthwin1500-cmyk/aungsetthwin1500-cmyk.github.io
  branch: main

media_folder: "images/products"
public_folder: "images/products"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Price (MMK)", name: "price", widget: "number" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "In Stock", name: "in_stock", widget: "boolean", default: true }

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection - SUNFLOWER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #222222;
            --accent: #d4af37;
            --bg-light: #faf8f5;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --border: #eae6df;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--primary); text-decoration: none; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-menu a { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 500; }
        .nav-menu a.active { color: var(--accent); }

        .container { max-width: 1300px; margin: 40px auto; padding: 0 8%; }
        .page-title { text-align: center; font-size: 28px; font-weight: 300; letter-spacing: 1px; margin-bottom: 40px; text-transform: uppercase; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .product-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
        .product-price { color: var(--accent); font-weight: 600; font-size: 14px; margin-bottom: 15px; }

        .btn-order {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 0;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
        }

        .btn-order:hover { background: var(--accent); }

        footer { background-color: var(--primary); color: #888; text-align: center; padding: 30px; font-size: 13px; margin-top: 80px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">SUNFLOWER</a>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html" class="active">Collection</a></li>
            <li><a href="promotion.html">Promotions</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Our Collections</h1>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600">
                <div class="product-title">Minimalist Summer Dress</div>
                <div class="product-price">၂၅,၀၀၀ ကျပ်</div>
                <a href="https://m.me/sunflower" target="_blank" class="btn-order">Order Now</a>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600">
                <div class="product-title">Casual Linen Top</div>
                <div class="product-price">၁၈,၀၀၀ ကျပ်</div>
                <a href="https://m.me/sunflower" target="_blank" class="btn-order">Order Now</a>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?q=80&w=600">
                <div class="product-title">Elegance Long Skirt</div>
                <div class="product-price">၂၂,၀၀၀ ကျပ်</div>
                <a href="https://m.me/sunflower" target="_blank" class="btn-order">Order Now</a>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1551163943-3f6a855d1153?q=80&w=600">
                <div class="product-title">Classic White Shirt</div>
                <div class="product-price">၂၀,၀၀၀ ကျပ်</div>
                <a href="https://m.me/sunflower" target="_blank" class="btn-order">Order Now</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SUNFLOWER CLOTHING. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပရိုမိုးရှင်း - SUNFLOWER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d97706;
            --bg-body: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Padauk', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-dark); }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 7%;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-size: 15px; font-weight: 600; padding: 8px 16px; border-radius: 8px; }
        .nav-links a.active { background-color: #fef3c7; color: var(--primary); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .page-title { text-align: center; margin-bottom: 30px; font-size: 28px; }

        .promo-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .promo-code {
            background: #fef3c7;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px dashed var(--primary);
        }

        .btn-copy {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        footer { text-align: center; padding: 30px; background: white; margin-top: 60px; border-top: 1px solid var(--border-color); color: var(--text-gray); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo"><i class="fa-solid fa-sun"></i> SUNFLOWER</a>
        <ul class="nav-links">
            <li><a href="index.html">ပင်မစာမျက်နှာ</a></li>
            <li><a href="products.html">အထည်များ</a></li>
            <li><a href="promotion.html" class="active">ပရိုမိုးရှင်း</a></li>
            <li><a href="contact.html">ဆက်သွယ်ရန်</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1 class="page-title">အထူး လျှော့ဈေး အစီအစဉ်များ</h1>

        <div class="promo-card">
            <div>
                <h3>၁၀% လျှော့ဈေး ကူပွန်</h3>
                <p style="color: var(--text-gray); font-size: 14px;">ပထမဆုံးအကြိမ် ဝယ်ယူသူများအတွက်</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span class="promo-code" id="c1">SUNFLOWER10</span>
                <button class="btn-copy" onclick="copyCode('c1')">Copy ယူမည်</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SUNFLOWER CLOTHING. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        function copyCode(id) {
            const code = document.getElementById(id).innerText;
            navigator.clipboard.writeText(code);
            alert('ကူပွန်ကုဒ် ' + code + ' ကို Copy ယူပြီးပါပြီ။');
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions - SUNFLOWER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #222222;
            --accent: #d4af37;
            --bg-light: #faf8f5;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --border: #eae6df;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--primary); text-decoration: none; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-menu a { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 500; }
        .nav-menu a.active { color: var(--accent); }

        .container { max-width: 900px; margin: 50px auto; padding: 0 8%; }
        .page-title { text-align: center; font-size: 28px; font-weight: 300; letter-spacing: 1px; margin-bottom: 40px; text-transform: uppercase; }

        .promo-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .promo-details h3 { font-size: 18px; font-weight: 500; margin-bottom: 5px; }
        .promo-details p { color: #777; font-size: 14px; }

        .promo-code-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .code-tag {
            background: #f4efea;
            border: 1px dashed var(--accent);
            color: var(--primary);
            padding: 10px 18px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .btn-copy {
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px 20px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-copy:hover { background: var(--accent); }

        footer { background-color: var(--primary); color: #888; text-align: center; padding: 30px; font-size: 13px; margin-top: 80px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">SUNFLOWER</a>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Collection</a></li>
            <li><a href="promotion.html" class="active">Promotions</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Special Offers</h1>

        <div class="promo-box">
            <div class="promo-details">
                <h3>NEW CUSTOMER DISCOUNT</h3>
                <p>ပထမဆုံးအကြိမ် ဝယ်ယူသူများအတွက် ၁၀% လျှော့ဈေး</p>
            </div>
            <div class="promo-code-wrap">
                <span class="code-tag" id="code1">SUNFLOWER10</span>
                <button class="btn-copy" onclick="copyCoupon('code1')">Copy</button>
            </div>
        </div>

        <div class="promo-box">
            <div class="promo-details">
                <h3>FREE SHIPPING OFFER</h3>
                <p>၃ ထည်နှင့်အထက် ဝယ်ယူပါက ပို့ခ အခမဲ့</p>
            </div>
            <div class="promo-code-wrap">
                <span class="code-tag" id="code2">FREESHIP3</span>
                <button class="btn-copy" onclick="copyCoupon('code2')">Copy</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SUNFLOWER CLOTHING. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        function copyCoupon(id) {
            const code = document.getElementById(id).innerText;
            navigator.clipboard.writeText(code);
            alert('Promo Code: ' + code + ' ကို ကူးယူပြီးပါပြီ။');
        }
    </script>

</body>
</html>

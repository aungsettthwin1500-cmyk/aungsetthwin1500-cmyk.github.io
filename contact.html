<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SUNFLOWER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #222222;
            --accent: #d4af37;
            --bg-light: #faf8f5;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --border: #eae6df;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--primary); text-decoration: none; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-menu a { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 500; }
        .nav-menu a.active { color: var(--accent); }

        .container { max-width: 1100px; margin: 50px auto; padding: 0 8%; }
        .page-title { text-align: center; font-size: 28px; font-weight: 300; letter-spacing: 1px; margin-bottom: 40px; text-transform: uppercase; }

        .contact-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 35px;
        }

        .info-card h3 {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            color: #555;
            font-size: 15px;
        }

        .info-item i { color: var(--accent); font-size: 18px; }

        .map-card iframe {
            width: 100%;
            height: 320px;
            border: 1px solid var(--border);
        }

        footer { background-color: var(--primary); color: #888; text-align: center; padding: 30px; font-size: 13px; margin-top: 80px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">SUNFLOWER</a>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Collection</a></li>
            <li><a href="promotion.html">Promotions</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Get In Touch</h1>

        <div class="contact-layout">
            <div class="info-card">
                <h3>Contact Information</h3>
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>ပုသိမ်မြို့၊ ဧရာဝတီတိုင်းဒေသကြီး။</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>09-123456789</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>contact@sunflowerfashion.com</span>
                </div>
            </div>

            <div class="map-card">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30568.188219409893!2d94.716667!3d16.783333!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30b12752174d1a0d%3A0x867eb32644e542db!2sPathein!5e0!3m2!1sen!2smm!4v1680000000000"></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SUNFLOWER CLOTHING. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>

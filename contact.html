<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sunflower Clothing</title>
    <style>
        :root { --primary: #FFB703; --primary-hover: #FB8500; --bg-light: #FFFDF9; --surface: #FFFFFF; --text-dark: #023047; --glass-bg: rgba(255, 255, 255, 0.75); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        
        header { position: sticky; top: 15px; z-index: 1000; margin: 0 5%; }
        nav { background: var(--glass-bg); backdrop-filter: blur(12px); border-radius: 50px; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 600; }
        .nav-links a.active { color: var(--primary-hover); }

        .container { max-width: 700px; margin: 50px auto; padding: 0 20px; }
        .contact-box { background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #E2E8F0; border-radius: 12px; outline: none; transition: 0.3s; background: #FAFAFA; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-hover); background: white; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.95; transform: translateY(-2px); }

        footer { background: var(--text-dark); color: white; text-align: center; padding: 25px; margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">🌻 Sunflower</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="promotion.html">Promotions</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="contact-box">
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Contact Us</h2>
            <p style="color: #666; margin-bottom: 30px;">စုံစမ်းမေးမြန်းလိုသည်များကို အောက်ပါ Form တွင် ဖြည့်သွင်းပေးပို့နိုင်ပါသည်။</p>
            <form action="#">
                <div class="form-group">
                    <label>အမည်</label>
                    <input type="text" placeholder="သင့်အမည် ရိုက်ထည့်ပါ">
                </div>
                <div class="form-group">
                    <label>ဖုန်း သို့မဟုတ် အီးမေးလ်</label>
                    <input type="text" placeholder="၀၉xxxxxxxxx / example@mail.com">
                </div>
                <div class="form-group">
                    <label>စာမက်ဆေ့ချ်</label>
                    <textarea rows="4" placeholder="ဒီမှာ ရေးသားပါ..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sunflower Flower Clothing.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products ‹ Sunflower — WordPress Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; }
        body { background-color: #f0f0f1; color: #2c3338; font-size: 13px; }
        
        .wp-wrap { padding: 20px; max-width: 1400px; margin: auto; }
        .wp-heading { font-size: 23px; font-weight: 400; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Form Section */
        .wp-card { background: #fff; border: 1px solid #c3c4c7; padding: 15px; margin-bottom: 20px; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; }
        .form-group input, .form-group select { width: 100%; padding: 6px 8px; border: 1px solid #8c8f94; border-radius: 4px; font-size: 13px; }
        
        .button-primary { background: #2271b1; border-color: #2271b1; color: #fff; padding: 6px 12px; border-radius: 3px; cursor: pointer; border-style: solid; font-weight: 600; }
        .button-primary:hover { background: #135e96; }
        .button-cancel { background: #d63638; border: none; color: white; padding: 6px 12px; border-radius: 3px; cursor: pointer; display: none; }

        /* Filter & Search Bar */
        .tablenav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .search-box input { padding: 4px 8px; border: 1px solid #8c8f94; border-radius: 4px; }

        /* WooCommerce Table Style */
        .wp-list-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #c3c4c7; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
        .wp-list-table th { background: #fff; border-bottom: 1px solid #c3c4c7; padding: 8px; text-align: left; font-weight: 600; color: #2c3338; }
        .wp-list-table td { padding: 8px; border-bottom: 1px solid #f0f0f1; vertical-align: top; }
        .wp-list-table tr:hover { background-color: #f6f7f7; }

        /* Product Image & Title Area */
        .thumb { width: 40px; height: 40px; object-fit: cover; border: 1px solid #dcdcde; border-radius: 2px; }
        .product-title { font-weight: 600; color: #2271b1; text-decoration: none; font-size: 14px; display: block; }
        
        /* WooCommerce Hover Row Actions */
        .row-actions { visibility: hidden; font-size: 11px; padding-top: 4px; color: #a7aaad; }
        tr:hover .row-actions { visibility: visible; }
        .row-actions a { color: #2271b1; text-decoration: none; cursor: pointer; }
        .row-actions a.trash { color: #b32d2e; }

        /* Status & Badges */
        .instock { color: #008a20; font-weight: 600; }
        .outstock { color: #d63638; font-weight: 600; }
        .category-tag { color: #2271b1; }
    </style>
</head>
<body>

<div class="wp-wrap">
    <div class="wp-heading">
        <h2>Products List</h2>
        <a href="index.html" style="font-size: 13px; color: #d63638; text-decoration: none;">← Back to Website</a>
    </div>

    <!-- Add/Edit Form Card -->
    <div class="wp-card">
        <strong id="formTitle">Add New Product</strong>
        <form id="productForm" style="margin-top: 10px;">
            <input type="hidden" id="editIndex" value="-1">
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="pName" placeholder="Product Name" required>
                </div>
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="pSKU" placeholder="e.g. ID: 191429">
                </div>
                <div class="form-group">
                    <label>Price (Ks)</label>
                    <input type="number" id="pPrice" placeholder="Price" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="pCategory" placeholder="e.g. Construction Material">
                </div>
                <div class="form-group">
                    <label>Stock Status</label>
                    <select id="pStock">
                        <option value="In stock">In stock</option>
                        <option value="Out of stock">Out of stock</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <input type="file" id="pImage" accept="image/*">
                </div>
            </div>

            <button type="submit" id="saveBtn" class="button-primary">Save Product</button>
            <button type="button" id="cancelBtn" class="button-cancel" onclick="resetForm()">Cancel Edit</button>
        </form>
    </div>

    <!-- Table Top Nav -->
    <div class="tablenav">
        <div>
            <strong>All (<span id="totalCount">0</span>)</strong>
        </div>
        <div class="search-box">
            <input type="text" id="searchBar" onkeyup="filterProducts()" placeholder="Search products...">
        </div>
    </div>

    <!-- WooCommerce Style Data Table -->
    <table class="wp-list-table">
        <thead>
            <tr>
                <th style="width: 50px;">Image</th>
                <th>Name</th>
                <th>SKU</th>
                <th>Stock</th>
                <th>Price</th>
                <th>Categories</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="productList">
            <!-- JavaScript injected rows -->
        </tbody>
    </table>
</div>

<script>
    // Initial Data List
    let products = JSON.parse(localStorage.getItem('wpProducts')) || [
        {
            name: "Dextone Gasket ကော် ခဲရောင် 50g",
            sku: "191429",
            price: "4500",
            category: "Construction Material, Silicone Sealants",
            stock: "In stock",
            date: "2026/06/27",
            image: ""
        }
    ];

    const form = document.getElementById('productForm');
    const productList = document.getElementById('productList');
    const editIndexInput = document.getElementById('editIndex');

    function renderProducts(dataToRender = products) {
        productList.innerHTML = '';
        document.getElementById('totalCount').innerText = dataToRender.length;

        if (dataToRender.length === 0) {
            productList.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px;">No products found.</td></tr>`;
            return;
        }

        dataToRender.forEach((p, index) => {
            const row = document.createElement('tr');
            const img = p.image || 'https://via.placeholder.com/40?text=No+Img';
            const stockClass = p.stock === "In stock" ? "instock" : "outstock";

            row.innerHTML = `
                <td><img src="${img}" class="thumb"></td>
                <td>
                    <a href="#" class="product-title">${p.name}</a>
                    <!-- WooCommerce Hover Action Buttons -->
                    <div class="row-actions">
                        <a onclick="editProduct(${index})">Edit</a> | 
                        <a class="trash" onclick="deleteProduct(${index})">Trash</a>
                    </div>
                </td>
                <td>${p.sku || '-'}</td>
                <td class="${stockClass}">${p.stock}</td>
                <td>${p.price ? Number(p.price).toLocaleString() + ' Ks' : '-'}</td>
                <td class="category-tag">${p.category || '-'}</td>
                <td>${p.date || '-'}</td>
            `;
            productList.appendChild(row);
        });

        localStorage.setItem('wpProducts', JSON.stringify(products));
    }

    // Image Convert Helper
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // Form Submit
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const editIndex = parseInt(editIndexInput.value);
        
        const name = document.getElementById('pName').value;
        const sku = document.getElementById('pSKU').value;
        const price = document.getElementById('pPrice').value;
        const category = document.getElementById('pCategory').value;
        const stock = document.getElementById('pStock').value;
        const fileInput = document.getElementById('pImage');

        let imageData = "";
        if (fileInput.files.length > 0) {
            imageData = await getBase64(fileInput.files[0]);
        } else if (editIndex !== -1) {
            imageData = products[editIndex].image;
        }

        const currentDate = new Date().toISOString().split('T')[0];

        const productData = { name, sku, price, category, stock, date: currentDate, image: imageData };

        if (editIndex === -1) {
            products.unshift(productData); // Add to top
        } else {
            products[editIndex] = productData;
        }

        resetForm();
        renderProducts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sunflower Clothing</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 22px; color: #023047; }
        .btn-view-site { background-color: #023047; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; }

        /* Form Card */
        .form-section { background: #fffdf9; border: 1px solid #ffe3a8; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .form-section h3 { margin-bottom: 15px; color: #fb8500; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .btn-submit { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-cancel { background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; }

        /* Top Nav & Search Bar */
        .table-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .search-box { width: 250px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; font-size: 14px; }
        th { background-color: #ffb703; color: #023047; font-weight: bold; }
        
        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        .badge-cat { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: capitalize; }
        
        .btn-edit { background-color: #ffc107; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌻 Sunflower Clothing — Admin Dashboard</h1>
            <a href="products.html" class="btn-view-site" target="_blank"><i class="fa-solid fa-store"></i> View Products Page</a>
        </div>

        <!-- Add / Edit Form -->
        <div class="form-section">
            <h3 id="formTitle"><i class="fa-solid fa-plus-circle"></i> Product အသစ် ထည့်သွင်းရန်</h3>
            <form id="productForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product အမည်</label>
                        <input type="text" id="pName" placeholder="ဥပမာ - Summer Yellow Dress" required>
                    </div>
                    <div class="form-group">
                        <label>Category (အမျိုးအစား)</label>
                        <select id="pCategory">
                            <option value="dresses">Dresses</option>
                            <option value="tops">Tops & Tees</option>
                            <option value="jackets">Jackets</option>
                            <option value="pants">Pants & Skirts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>စျေးနှုန်း (MMK)</label>
                        <input type="text" id="pPrice" placeholder="ဥပမာ - 25,000 MMK" required>
                    </div>
                    <div class="form-group">
                        <label>Product ဓာတ်ပုံ (Drive / Local မှ ရွေးရန်)</label>
                        <input type="file" id="pImage" accept="image/*">
                    </div>
                </div>

                <button type="submit" id="saveBtn" class="btn-submit">Save Product</button>
                <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">Cancel Edit</button>
            </form>
        </div>

        <!-- Table View -->
        <div class="table-nav">
            <h3>Product စာရင်းများ (စုစုပေါင်း: <span id="totalCount">0</span>)</h3>
            <input type="text" id="searchBar" class="search-box" onkeyup="filterProducts()" placeholder="🔍 ရှာဖွေရန်...">
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">စဉ်</th>
                    <th style="width: 70px;">ပုံ</th>
                    <th>Product အမည်</th>
                    <th>Category</th>
                    <th>စျေးနှုန်း</th>
                    <th style="width: 150px;">လုပ်ဆောင်ချက်</th>
                </tr>
            </thead>
            <tbody id="productList">
                <!-- JavaScript မှ မူလ Product 48 ခုကို Auto ဆွဲထုတ်ပေးပါမည် -->
            </tbody>
        </table>
    </div>

            { name: "Floral Long Skirt", category: "pants", price: "24,000 MMK", image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=500" },
            { name: "Cargo Utility Pants", category: "pants", price: "30,000 MMK", image: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500" },
            { name: "Casual Short Pants", category: "pants", price: "18,000 MMK", image: "https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=500" },
            { name: "Slim Fit Chinos", category: "pants", price: "29,000 MMK", image: "https://images.unsplash.com/photo-1509551388413-e18d0ac5d495?w=500" },
            { name: "Linen Summer Pants", category: "pants", price: "26,000 MMK", image: "https://images.unsplash.com/photo-1560243563-062bfc001d68?w=500" }
        ];

        // LocalStorage မှ မလိုသေးလျှင် မူလ 48 ခုကို ယူမည်
        let products = JSON.parse(localStorage.getItem('sunflowerProducts')) || initialProducts;

        const productList = document.getElementById('productList');
        const form = document.getElementById('productForm');
        const editIndexInput = document.getElementById('editIndex');

        // Table တွင် Data ပြသခြင်း
        function renderProducts(dataToDisplay = products) {
            productList.innerHTML = '';
            document.getElementById('totalCount').innerText = dataToDisplay.length;

            dataToDisplay.forEach((p, index) => {
                const row = document.createElement('tr');
                const img = p.image || 'https://via.placeholder.com/50?text=No+Img';

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><img src="${img}" class="img-thumb"></td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge-cat">${p.category}</span></td>
                    <td style="color:#fb8500; font-weight:bold;">${p.price}</td>
                    <td>
                        <button class="btn-edit" onclick="editProduct(${index})">ပြင်မည်</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">ဖျက်မည်</button>
                    </td>
                `;
                productList.appendChild(row);
            });

            localStorage.setItem('sunflowerProducts', JSON.stringify(products));
        }

        // Image Base64 Convert
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Add or Update
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editIndex = parseInt(editIndexInput.value);

            const name = document.getElementById('pName').value;
            const category = document.getElementById('pCategory').value;
            const price = document.getElementById('pPrice').value;
            const fileInput = document.getElementById('pImage');

            let imageData = "";
            if (fileInput.files.length > 0) {
                imageData = await getBase64(fileInput.files[0]);
            } else if (editIndex !== -1) {
                imageData = products[editIndex].image;
            } else {
                imageData = 'https://via.placeholder.com/50?text=No+Img';
            }

            const item = { name, category, price, image: imageData };

            if (editIndex === -1) {
                products.unshift(item); // အသစ်ကို အပေါ်ဆုံးထည့်မည်
            } else {
                products[editIndex] = item;
            }

            resetForm();
            renderProducts();
        });

        // Edit Mode
        function editProduct(index) {
            const p = products[index];
            document.getElementById('pName').value = p.name;
            document.getElementById('pCategory').value = p.category;
            document.getElementById('pPrice').value = p.price;
            editIndexInput.value = index;

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Product ပြင်ဆင်ရန်';
            document.getElementById('saveBtn').innerText = "Update Product";
            document.getElementById('cancelBtn').style.display = "inline-block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset Form
        function resetForm() {
            form.reset();
            editIndexInput.value = "-1";
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i> Product အသစ် ထည့်သွင်းရန်';
            document.getElementById('saveBtn').innerText = "Save Product";
            document.getElementById('cancelBtn').style.display = "none";
        }

        // Delete
        function deleteProduct(index) {
            if (confirm(`'${products[index].name}' ကို စာရင်းထဲမှ ဖျက်မှာ သေချာပါသလား?`)) {
                products.splice(index, 1);
                renderProducts();
            }
        }

        // Search Filter
        function filterProducts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.category.toLowerCase().includes(query) ||
                p.price.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        // Initial Load
        renderProducts();
    </script>
</body>
</html>
